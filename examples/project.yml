project:
  outdir: runs/project-001
  continue_on_error: true
  report_title: BioFlow Project Batch Report
  profile: workstation
  threads: 4
  memory: 8G
  queue: short
  time_limit: "02:00:00"
  backend: conda
  conda_env: bioflow-env
  samples:
    - sample_id: sample-qc
      workflow: qc
      input_r1: reads_1.fastq
      input_r2: reads_2.fastq
      adapter: adapters.fa
      minlen: 36
    - sample_id: sample-align
      workflow: align
      ref: ref.fa
      input_r1: reads_1.fastq
      input_r2: reads_2.fastq
      output: aligned.sorted.bam
      threads: 4
    - sample_id: sample-search
      workflow: search
      db: ref.fa
      query: query.fa
      output: hits.tsv
      profile: local
      backend: container
      container_image: ghcr.io/biocael-dev/bioflow-cli:latest
      evalue: 0.00001
      max_target_seqs: 20
      top: 5
    - sample_id: sample-rnaseq
      workflow: rnaseq
      index: salmon-transcriptome-index
      input_r1: rnaseq_1.fastq
      input_r2: rnaseq_2.fastq
      group: control
      condition: untreated
      lane: L001
      replicate: 1
      library_type: A
      threads: 8
    - sample_id: sample-rnaseq-treated
      workflow: rnaseq
      index: salmon-transcriptome-index
      input_r1: treated_1.fastq
      input_r2: treated_2.fastq
      group: treatment
      condition: treated
      lane: L002
      replicate: 1
      library_type: A
      threads: 8
    - sample_id: sample-longread
      workflow: longread
      ref: ref.fa
      input: nanopore_reads.fastq.gz
      output: nanopore.sorted.bam
      preset: map-ont
      threads: 8
    - sample_id: sample-variant
      workflow: variant
      ref: ref.fa
      bam: aligned.sorted.bam
      output: sample-variant.vcf.gz
      caller: bcftools
      min_qual: 20
      min_depth: 5
      threads: 4
